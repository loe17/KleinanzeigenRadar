services:
  kleinanzeigen-radar:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kleinanzeigen-radar
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8000}:8000"
      - "${HTTPS_PORT:-8443}:8443"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=8000
      - SSL_PORT=8443
      - ENABLE_HTTPS=true
      - HOST=0.0.0.0
      - TZ=Europe/Berlin
